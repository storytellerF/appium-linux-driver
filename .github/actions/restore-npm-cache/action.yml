name: Restore npm downloads
description: Restore a recent npm download snapshot and expose a unique key for saving it.
inputs:
  variant:
    description: Matrix identity within this job, such as node-22 or appium-3.
    required: true
outputs:
  path:
    description: npm download cache directory.
    value: ${{ steps.directory.outputs.path }}
  key:
    description: Unique snapshot key for the current job attempt.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  restored-key:
    description: Previous snapshot selected by the stable prefix, or empty on a miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}
runs:
  using: composite
  steps:
    - name: Locate npm download cache
      id: directory
      shell: bash
      run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - name: Restore recent npm download snapshot
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.directory.outputs.path }}
        key: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.variant }}
        restore-keys: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
