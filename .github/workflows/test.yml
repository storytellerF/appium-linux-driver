name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  desktop-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appium: [2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyatspi python3-gi gir1.2-gtk-3.0 at-spi2-core xdotool x11-utils libglib2.0-bin dbus-x11 xvfb xauth openbox
      - run: npm ci
      - name: Select Appium version
        env:
          APPIUM_MAJOR: ${{ matrix.appium }}
        run: npm install --no-save --package-lock=false --ignore-scripts "appium@$APPIUM_MAJOR"
      - run: npm run test:e2e
      - name: Preserve desktop diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-appium-${{ matrix.appium }}
          path: build/test-results/e2e
          if-no-files-found: warn
          retention-days: 7
