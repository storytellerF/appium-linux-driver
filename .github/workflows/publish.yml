name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}`);
          }
          if (version.includes('-') !== (process.env.RELEASE_PRERELEASE === 'true')) {
            throw new Error('Package version and GitHub Release prerelease status must agree');
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish package
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
